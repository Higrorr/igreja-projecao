<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playback</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #player {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #000;
    }
    #player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #dica {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      color: #fff;
      opacity: 0.85;
      font-size: 15px;
      line-height: 1.4;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="dica">Esc ou F11 sai da tela cheia</div>
  <script>
    var TAG = document.createElement('script');
    TAG.src = "https://www.youtube.com/iframe_api";
    var primeiro = document.getElementsByTagName('script')[0];
    primeiro.parentNode.insertBefore(TAG, primeiro);

    var player = null;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: "{{ youtube_id }}",
        playerVars: { autoplay: 0, rel: 0, playsinline: 1 },
        events: {
          // Inicia pausado no primeiro frame (capa do vídeo), aguardando o
          // operador apertar Play pelo celular.
          onReady: function () { if (player) player.pauseVideo(); }
        }
      });
    }

    // Polling do comando local: o celular aperta play/pause -> posta a ação,
    // este player consome via /api/player/comando e alterna.
    setInterval(function () {
      if (!window.YT || !player || !player.playVideo) return;
      fetch("/api/player/comando")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !player.getPlayerState) return;
          if (d.comando === "play_pause") {
            if (player.getPlayerState() === 1) {
              player.pauseVideo();
            } else {
              player.playVideo();
            }
          } else if (d.comando === "recomecar") {
            player.seekTo(0, true);
            player.playVideo();
          }
        })
        .catch(function () {});
    }, 1200);

    setTimeout(function () {
      var d = document.getElementById("dica");
      if (d) d.style.opacity = "0";
    }, 6000);
  </script>
</body>
</html>
