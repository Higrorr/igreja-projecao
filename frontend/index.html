<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1115">
  <title>Projeção · Igreja</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link
    rel = "shortcut icon"
    href = "https://cdn-icons-png.flaticon.com/512/3004/3004416.png"
    type = "favcon">
</head>
<body>
  <header class="cabecalho">
    <h1 class="titulo">Bíblia &amp; Harpa</h1>
    <div class="status" id="status" hidden>
      <button class="botao botao-secundario" id="btn-atualizar" type="button">Atualizar</button>
    </div>
  </header>

  <main>
    <div class="busca">
      <form id="form-busca" autocomplete="off">
        <input
          id="campo"
          class="campo"
          type="search"
          inputmode="search"
          placeholder="Buscar…"
          aria-label="Pesquisar"
        >
      </form>
    </div>

    <nav class="tab-bar" role="tablist" aria-label="Modo de busca">
      <button class="aba ativa" id="tab-acervo" type="button" role="tab"
              aria-selected="true" aria-controls="aba-acervo">Acervo</button>
      <button class="aba" id="tab-play" type="button" role="tab"
              aria-selected="false" aria-controls="aba-play">Playbacks</button>
      <button class="aba" id="tab-agenda" type="button" role="tab"
              aria-selected="false" aria-controls="aba-agenda">Agenda</button>
    </nav>

    <div id="aba-acervo" role="tabpanel" aria-labelledby="tab-acervo">
      <div id="vazio" class="vazio" hidden></div>
      <div id="carregando" class="vazio" hidden>Buscando…</div>
      <div id="resultados"></div>
    </div>

    <div id="aba-play" role="tabpanel" aria-labelledby="tab-play" hidden>
      <section class="salvos colapsavel" id="sec-savos">
        <h2 class="grupo-titulo colapsavel-titulo" tabindex="0" role="button"
            aria-expanded="true">Salvos
          <span class="colapsavel-seta" aria-hidden="true">▾</span></h2>
        <div class="colapsavel-conteudo">
          <div id="lista-play" class="item-lista"></div>
          <div id="play-vazio" class="vazio" hidden></div>
        </div>
      </section>

      <section class="salvos colapsavel" id="sec-canais">
        <h2 class="grupo-titulo colapsavel-titulo" tabindex="0" role="button"
            aria-expanded="true">Prioridade
          <span class="colapsavel-seta" aria-hidden="true">▾</span></h2>
        <div class="colapsavel-conteudo">
          <form id="form-canal" class="form-linha" autocomplete="off">
            <input id="campo-canal" class="campo" type="text"
                  placeholder="Canal…"
                  aria-label="Nome do canal para priorizar">
            <button class="botao" type="submit">Adicionar</button>
          </form>
          <div id="lista-canais" class="item-lista"></div>
          <div id="canais-vazio" class="vazio" hidden></div>
        </div>
      </section>

      <section class="salvos colapsavel colapsavel-aberto" id="sec-link">
        <h2 class="grupo-titulo colapsavel-titulo" tabindex="0" role="button"
            aria-expanded="true">Link
          <span class="colapsavel-seta" aria-hidden="true">▾</span></h2>
        <div class="colapsavel-conteudo">
          <form id="form-link" class="form-linha" autocomplete="off">
            <input id="campo-link" class="campo" type="url" inputmode="url"
                  placeholder="Link do vídeo…"
                  aria-label="Link do playback para salvar">
            <button class="botao" type="submit">Salvar</button>
          </form>
        </div>
      </section>

      <div class="yt-bar">
        <span class="dica-chip chip-toggle ativo" data-t="playback">Playback</span>
        <span class="dica-chip chip-toggle ativo" data-t="instrumental">Instrumental</span>
        <span class="dica-chip chip-toggle" data-t="vivo">Ao vivo</span>
      </div>

      <section id="yt" class="yt" hidden>
        <h2 class="grupo-titulo">Resultados <span class="yt-fonte" id="yt-fonte"></span></h2>
        <div id="yt-lista" class="item-lista"></div>
        <div id="yt-vazio" class="vazio" hidden></div>
      </section>
    </div>

    <div id="aba-agenda" role="tabpanel" aria-labelledby="tab-agenda" hidden>
      <form id="form-agenda" class="form-linha" autocomplete="off">
        <input id="campo-nome" class="campo campo-nome" type="text" placeholder="Nome…"
              aria-label="Nome da pessoa">
        <button class="botao botao-acao" type="submit">Adicionar</button>
      </form>

      <div id="agenda-lista" class="item-lista"></div>
      <div id="agenda-vazio" class="vazio" hidden></div>
    </div>
  </main>

  <div id="modal-preview" class="modal-preview" hidden>
    <div class="modal-preview-fundo" data-fechar-preview></div>
    <div class="modal-preview-caixa" role="dialog" aria-modal="true" aria-label="Prévia do playback">
      <div class="modal-preview-topo">
        <span id="preview-titulo" class="modal-preview-titulo"></span>
        <button type="button" class="modal-preview-fechar" data-fechar-preview
                aria-label="Fechar prévia">✕</button>
      </div>
      <div class="modal-preview-ratio">
        <iframe id="preview-iframe" title="Prévia"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen></iframe>
      </div>
      <div class="modal-preview-acoes">
        <button type="button" class="botao" id="btn-preview-projetar">Projetar</button>
      </div>
    </div>
  </div>

  <nav class="controle-remoto" role="toolbar" aria-label="Controle da projeção">
    <button type="button" class="controle-btn" id="btn-slide-ant" title="Voltar slide" aria-label="Voltar slide">‹</button>
    <button type="button" class="controle-btn controle-btn-destaque" id="btn-player-pause" title="Play/Pause" aria-label="Play ou pausar"><span id="icone-pause">▶</span></button>
    <button type="button" class="controle-btn" id="btn-slide-prox" title="Avançar slide" aria-label="Avançar slide">›</button>
    <button type="button" class="controle-btn" id="btn-player-recomecar" title="Recomeçar playback" aria-label="Voltar o playback ao início">↺</button>
    <button type="button" class="controle-btn controle-btn-nafrente" id="btn-primeiro-plano" title="Primeiro plano" aria-label="Levar a projeção para o primeiro plano"><span class="simbolo">⤒</span></button>
    <button type="button" class="controle-btn" id="btn-tela-preta" title="Tela preta" aria-label="Tela preta"><span id="icone-preto">■</span></button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
